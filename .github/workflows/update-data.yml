name: Check PRNG and publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: publish-geonames
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://miejsca.app
    permissions:
      contents: write
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before publishing."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Restore the last validated snapshot
        shell: bash
        run: |
          mkdir -p public/data
          status=0
          git ls-remote --exit-code --heads origin data > /tmp/geonames-data-ref || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git archive refs/remotes/origin/data | tar -x -C public/data
          elif [ "$status" != 2 ]; then
            exit "$status"
          fi
      - name: Check upstream and build downloads
        run: npm run data
      - run: npm run build
      - name: Check Cloudflare asset limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path('dist').rglob('*') if p.is_file()]
          if not files or len(files) > 20_000:
              raise SystemExit('Cloudflare requires between 1 and 20,000 static files on the Free plan.')
          oversized = [str(p) for p in files if p.stat().st_size > 25 * 1024 * 1024]
          if oversized:
              raise SystemExit('Files exceed the Cloudflare 25 MiB limit: ' + ', '.join(oversized))
          print(f'{len(files)} files fit the Cloudflare static asset limits.')
          PY
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Publish the validated website
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the published pages
        run: |
          curl --fail --silent --show-error --retry 3 --output /dev/null https://miejsca.app/pl/
          curl --fail --silent --show-error --retry 3 --output /dev/null https://miejsca.app/en/
          curl --fail --silent --show-error --retry 3 --output /dev/null https://miejsca.app/data/manifest.json
      - name: Save validated state on the data branch
        run: python3 scripts/save_state.py
      - name: Record the source check
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('public/data/manifest.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Snapshot: {m['version']}\n\nRecords: {m['count']:,}\n\nSource checked: {m['last_checked']}\n")
          PY
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
